[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaktus-configurator"
dynamic = ["version"]
description = "Flexible configurator for Python projects settings management"
readme = "readme.md"

license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "3elenyi Kaktus"}
]
maintainers = []
keywords = ["json", "config", "settings"]
classifiers = []

requires-python = ">=3.10"
dependencies = [
    "kaktus-json-helpers>=4.0.1",
    "pygraphviz>=2.0.1",
    "ruff>=0.16.0",
    "watchdog>=6.0.0",
]

import-namespace = ["kaktus"]
import-names = ["kaktus.configurator"]


[project.scripts]
config-regen = "kaktus.configurator.gen:generateConfigProxy"

[dependency-groups]
build = [
    "build>=1.5.0",
    "twine>=7.0.0",
]
dev = [
    "mypy>=2.3.0",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
]


[project.urls]
Repository = "https://github.com/3elenyi-Kaktus/configurator"


[tool.hatch.version]
path = "src/kaktus/configurator/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kaktus"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ASYNC", # flake8-async
]

[tool.ruff.lint.isort]
lines-after-imports = 2
combine-as-imports = true
force-sort-within-sections = true

[tool.mypy]
explicit_package_bases = true
mypy_path = "src"

strict = true

disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_untyped_decorators = true

[tool.poe.tasks]
# Formatting, Linting, Typechecking
fmt-base = "uv run ruff format"
fmt-imports = "uv run ruff check --select I --fix"
fmt = ["fmt-base", "fmt-imports"]
lint = "uv run ruff check"
type = "uv run mypy src tests"

# Tests
test = "uv run pytest -v"

# Build & Distribution
build = "uv run python -m build"
upload-test = "uv run python -m twine upload --repository testpypi dist/*"
upload = "uv run python -m twine upload dist/*"

# Combined runner
all = ["fmt", "lint", "type", "test", "build"]
